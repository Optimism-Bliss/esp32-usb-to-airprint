; a bare `pio run` (-t upload, -t ota) is the board only: without this it
; goes through every env, and the qemu image is flashed last, over the firmware
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
; ESP32-S3-N16R8: quad SPI flash
board_build.flash_mode = qio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; generates src/local_config.h from .env.example + .env, and the web UI
; (web/ -> components/webui/web_assets.c)
extra_scripts = pre:tools/gen_local_config.py, pre:tools/gen_web.py, post:tools/ota_target.py

; One firmware per CAPT laser: only that printer's driver, announced as that
; model even before the printer is plugged in.
;   pio run -e lbp2900 -t upload        pio run -e lbp3050 -t upload
; (.pio/build/<env>/firmware.bin; OTA: pio run -e <env> -t ota)
[env:lbp2900]
extends = env:esp32s3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.lbp2900

[env:lbp3050]
extends = env:esp32s3
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.lbp3050

; Same firmware with a self-test app_main for Espressif QEMU (see tools/qemu_selftest.sh)
[env:qemu]
extends = env:esp32s3
build_flags = -DPRINTSERVER_QEMU_SELFTEST
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.qemu
